[package]
name = "bine"
version = "0.1.0"
edition = "2021"
authors = ["BINE Project"]
description = "Bio-Inspired Network Encryption - Standalone implementation"
license = "MIT"

[dependencies]
# No external dependencies - pure Rust std only
# Note: rand is part of std in no_std compatible way

[lib]
name = "bine"
path = "src/lib.rs"

[[bin]]
name = "bine_bench"
path = "src/main.rs"

[[bin]]
name = "bine_compare"
path = "src/comparison.rs"

[[bin]]
name = "bine_v2_bench"
path = "src/bench_v2.rs"

[[bin]]
name = "rigorous_tests"
path = "src/rigorous_tests.rs"

[[bin]]
name = "validation_v3"
path = "src/validation_v3.rs"

[[bin]]
name = "validation_v4"
path = "src/validation_v4.rs"

[[bin]]
name = "validation_v5"
path = "src/validation_v5.rs"

[[bin]]
name = "validation_v6"
path = "src/validation_v6.rs"

[[bin]]
name = "validation_v7"
path = "src/validation_v7.rs"

[[bin]]
name = "reinforcement_demo"
path = "src/reinforcement_demo.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bin]]
name = "complete_benchmarks"
path = "src/complete_benchmarks.rs"

[[bin]]
name = "validation_v75"
path = "src/validation_v75.rs"

[[bin]]
name = "validation_v76"
path = "src/validation_v76.rs"

[[bin]]
name = "validation_v77"
path = "src/validation_v77.rs"

[[bin]]
name = "diagnose_differential"
path = "src/diagnose_differential.rs"

[[bin]]
name = "validation_v78"
path = "src/validation_v78.rs"

[[bin]]
name = "test_whitening"
path = "src/test_whitening.rs"

[[bin]]
name = "validation_v79"
path = "src/validation_v79.rs"

[[bin]]
name = "validation_v80"
path = "src/validation_v80.rs"

[[bin]]
name = "test_hash_direct"
path = "src/test_hash_direct.rs"

