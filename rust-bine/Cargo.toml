[package]
name = "bine"
version = "0.1.0"
edition = "2021"
authors = ["BINE Project"]
description = "Bio-Inspired Network Encryption - A novel cryptographic algorithm inspired by nature's most resilient organisms"
license = "MIT"
repository = "https://github.com/Ca3de/BINE"
keywords = ["cryptography", "encryption", "hashing", "bio-inspired", "security"]
categories = ["cryptography", "algorithms"]

[dependencies]
blake2 = "0.10"
rand = "0.8"
getrandom = "0.2"

[dev-dependencies]
hex = "0.4"
sha2 = "0.10"

[lib]
name = "bine"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
