[package]
name = "bine"
version = "0.1.0"
edition = "2021"
authors = ["BINE Project"]
description = "Bio-Inspired Network Encryption - Standalone implementation"
license = "MIT"

[dependencies]
# No external dependencies - pure Rust std only

[lib]
name = "bine"
path = "src/lib.rs"

[[bin]]
name = "bine_bench"
path = "src/main.rs"

[[bin]]
name = "bine_compare"
path = "src/comparison.rs"

[[bin]]
name = "bine_v2_bench"
path = "src/bench_v2.rs"

[[bin]]
name = "rigorous_tests"
path = "src/rigorous_tests.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
